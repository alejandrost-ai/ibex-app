<!-- PANTALLA DE INICIO DE SESIÓN (LOGIN) -->
<div id="pantalla-login" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f172a; font-family: 'Segoe UI', Roboto, sans-serif;">
    <div style="background-color: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 320px; text-align: center;">
        <h2 style="color: #f8fafc; margin-bottom: 20px;">Acceso Cartera</h2>
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px;">Usuario</label>
            <input type="text" id="login-usuario" placeholder="Introduce tu usuario" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px;">Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
        </div>
        <button onclick="verificarAcceso()" style="width: 100%; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px;">Iniciar Sesión</button>
        <p id="error-login" style="color: #ef4444; font-size: 12px; margin-top: 15px; display: none;">Usuario o contraseña incorrectos.</p>
    </div>
</div>

<!-- CONTENIDO PRINCIPAL DE LA APP -->
<div id="app-principal" class="app-container" style="display: none;">
    <div class="header">
        <h2>Mi Cartera IBEX 35</h2>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button onclick="cerrarSesion()" style="width: auto; background-color: #475569; font-size: 11px; padding: 6px 12px; border: none; color: white; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
            <span id="estado-api" style="font-size: 11px; color: #94a3b8;">Precios: Cargando...</span>
        </div>
    </div>

    <div class="balance-card">
        <div style="color: #94a3b8; font-size: 14px;">Valor de tu Cartera</div>
        <div class="balance-total" id="total-cartera">0,00 €</div>
        
        <div class="reval-container">
            <div class="reval-box">
                <div style="font-size: 11px; color: #94a3b8;">REVAL. HOY</div>
                <div id="reval-dia" class="neutro">0,00 € (0%)</div>
            </div>
            <div class="reval-box">
                <div style="font-size: 11px; color: #94a3b8;">REVAL. ACUMULADA</div>
                <div id="reval-total" class="neutro">0,00 € (0%)</div>
            </div>
        </div>
    </div>

    <div class="formulario">
        <h4 style="margin-top: 0; margin-bottom: 15px;">Añadir Acción</h4>
        <div class="input-group">
            <label>Empresa del Ibex</label>
            <select id="select-empresa">
                <!-- Usamos los Tickers Oficiales de Bolsa para la sincronización con internet -->
                <option value="SAN.MC">Banco Santander</option>
                <option value="TEF.MC">Telefónica</option>
                <option value="IBE.MC">Iberdrola</option>
                <option value="ITX.MC">Inditex</option>
                <option value="BBVA.MC">BBVA</option>
            </select>
        </div>
        <div class="input-group">
            <label>Precio de compra por acción (€)</label>
            <input type="number" id="input-precio" placeholder="Ej: 4.00" step="0.01">
        </div>
        <div class="input-group">
            <label>Número de Acciones</label>
            <input type="number" id="input-cantidad" placeholder="Ej: 50">
        </div>
        <button onclick="agregarAccion()">Guardar en Cartera</button>
    </div>

    <div class="lista-acciones">
        <h4>Tus Acciones</h4>
        <div id="contenedor-lista"></div>
    </div>
</div>

<!-- LÓGICA COCTACIÓN EN VIVO + BASE DE DATOS LOCAL -->
<script>
    const USUARIO_CORRECTO = "admin";
    const PASSWORD_CORRECTA = "bolsa123";

    // Precios de respaldo (por si falla internet)
    let MERCADO = {
        "SAN.MC": { nombre: "Banco Santander", actual: 4.15, variacionDiaPorcentaje: 0.5 },
        "TEF.MC": { nombre: "Telefónica", actual: 4.20, variacionDiaPorcentaje: -0.2 },
        "IBE.MC": { nombre: "Iberdrola", actual: 11.80, variacionDiaPorcentaje: 1.1 },
        "ITX.MC": { nombre: "Inditex", actual: 44.50, variacionDiaPorcentaje: -0.8 },
        "BBVA.MC": { nombre: "BBVA", actual: 9.30, variacionDiaPorcentaje: 0.0 }
    };

    let misAcciones = JSON.parse(localStorage.getItem('cartera_ibex_gh')) || [];

    // CONEXIÓN EN TIEMPO REAL CON LA BOLSA
    async function consultarBolsaEnVivo() {
        const estadoApi = document.getElementById('estado-api');
        try {
            // Consultamos los tickers del Ibex 35 a través de una API financiera abierta
            const tickers = Object.keys(MERCADO).join(',');
            const respuesta = await fetch(`https://yahoo.com{tickers}`);
            const data = await respuesta.json();
            
            if (data.quoteResponse && data.quoteResponse.result) {
                data.quoteResponse.result.forEach(stock => {
                    if (MERCADO[stock.symbol]) {
                        MERCADO[stock.symbol].actual = stock.regularMarketPrice;
                        MERCADO[stock.symbol].variacionDiaPorcentaje = stock.regularMarketChangePercent;
                    }
                });
                estadoApi.innerText = "Precios: En Vivo Real";
                estadoApi.style.color = "#10b981";
            }
        } catch (error) {
            console.log("Error al consultar datos en tiempo real, usando respaldo:", error);
            estadoApi.innerText = "Precios: Modo Respaldo";
            estadoApi.style.color = "#f59e0b";
        }
        actualizarPantalla();
    }

    // CONTROL DE ACCESO
    function verificarAcceso() {
        const usuarioInput = document.getElementById('login-usuario').value;
        const passwordInput = document.getElementById('login-password').value;
        const msgError = document.getElementById('error-login');

        if (usuarioInput === USUARIO_CORRECTO && passwordInput === PASSWORD_CORRECTA) {
            sessionStorage.setItem('sesion_activa', 'true');
            mostrarAppPrincipal();
        } else {
            msgError.style.display = "block";
        }
    }

    function mostrarAppPrincipal() {
        document.getElementById('pantalla-login').style.display = "none";
        document.getElementById('app-principal').style.display = "block";
        consultarBolsaEnVivo(); // Consultar precios reales al entrar
    }

    function cerrarSesion() {
        sessionStorage.removeItem('sesion_activa');
        document.getElementById('pantalla-login').style.display = "flex";
