<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cartera IBEX 35</title>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .balance-total {
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0;
        }

        .reval-container {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #334155;
            padding-top: 10px;
            font-size: 14px;
        }

        .reval-box {
            text-align: center;
            flex: 1;
        }

        .positivo {
            color: #10b981;
            font-weight: bold;
        }

        .negativo {
            color: #ef4444;
            font-weight: bold;
        }

        .neutro {
            color: #94a3b8;
            font-weight: bold;
        }

        .formulario {
            background-color: #334155;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .lista-acciones {
            margin-top: 20px;
        }

        .accion-item {
            background-color: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .accion-fila {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .accion-nombre {
            font-weight: bold;
        }

        .accion-detalles {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            line-height: 1.4;
        }

        .accion-precio {
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-borrar {
            background-color: #ef4444;
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            margin-top: 8px;
            border-radius: 4px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .mensaje-vacio {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            padding: 15px;
            border: 1px dashed #475569;
            border-radius: 10px;
        }

        a {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- PANTALLA DE LOGIN Y REGISTRO -->
    <div id="pantalla-login" style="display: flex; justify-content: center; align-items: center; width: 100%;">
        <div style="background-color: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 320px; text-align: center; box-sizing: border-box;">
            <h2 id="login-titulo" style="color: #f8fafc; margin-bottom: 20px; font-weight: 600;">
                Acceso Seguro
            </h2>

            <div style="margin-bottom: 15px; text-align: left;">
                <label>Usuario</label>
                <input type="text" id="login-usuario" placeholder="Introduce tu usuario">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label>Contraseña</label>
                <input type="password" id="login-password" placeholder="Introduce tu contraseña">
            </div>

            <div id="bloque-botones-login">
                <button onclick="verificarAcceso()" style="background-color: #3b82f6; margin-bottom: 15px;">
                    Iniciar Sesión
                </button>
                <span style="color: #94a3b8; font-size: 13px;">
                    ¿No tienes cuenta?
                    <a onclick="cambiarModoLogin(true)" style="color: #3b82f6; text-decoration: none; font-weight: bold;">
                        Regístrate
                    </a>
                </span>
            </div>

            <div id="bloque-botones-registro" style="display: none;">
                <button onclick="registrarNuevoUsuario()" style="background-color: #10b981; margin-bottom: 15px;">
                    Crear Cuenta
                </button>
                <span style="color: #94a3b8; font-size: 13px;">
                    ¿Ya tienes cuenta?
                    <a onclick="cambiarModoLogin(false)" style="color: #3b82f6; text-decoration: none; font-weight: bold;">
                        Identifícate
                    </a>
                </span>
            </div>

            <p id="error-login" style="color: #ef4444; font-size: 12px; margin-top: 15px; display: none; font-weight: 500;"></p>

            <p style="font-size: 11px; color: #64748b; margin-top: 20px;">
                Usuario demo: admin | Contraseña: bolsa123
            </p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-principal" class="app-container" style="display: none;">
        <div class="header">
            <h2 style="margin-bottom: 5px; font-weight: 600;">
                Mi Cartera IBEX 35
            </h2>

            <div style="font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 15px;">
                Usuario: <span id="nombre-usuario-activo"></span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button onclick="cerrarSesion()" style="width: auto; background-color: #475569; font-size: 11px; padding: 6px 12px;">
                    Cerrar Sesión
                </button>
                <span id="estado-api" style="font-size: 11px; color: #10b981; font-weight: bold;">
                    Guardado local
                </span>
            </div>
        </div>

        <div class="balance-card">
            <div style="color: #94a3b8; font-size: 14px;">
                Valor de tu Cartera
            </div>

            <div class="balance-total" id="total-cartera">
                0,00 €
            </div>

            <div class="reval-container">
                <div class="reval-box">
                    <div style="font-size: 11px; color: #94a3b8;">
                        REVAL. HOY
                    </div>
                    <div id="reval-dia" class="neutro">
                        0,00 € (0,00%)
                    </div>
                </div>

                <div class="reval-box">
                    <div style="font-size: 11px; color: #94a3b8;">
                        REVAL. ACUMULADA
                    </div>
                    <div id="reval-total" class="neutro">
                        0,00 € (0,00%)
                    </div>
                </div>
            </div>
        </div>

        <div class="formulario">
            <h4 style="margin-top: 0; margin-bottom: 15px; font-weight: 600;">
                Añadir Acción
            </h4>

            <div class="input-group">
                <label>Empresa del IBEX</label>
                <select id="select-empresa">
                    <option value="SAN.MC">Banco Santander</option>
                    <option value="TEF.MC">Telefónica</option>
                    <option value="IBE.MC">Iberdrola</option>
                    <option value="ITX.MC">Inditex</option>
                    <option value="BBVA.MC">BBVA</option>
                </select>
            </div>

            <div class="input-group">
                <label>Precio de compra por acción (€)</label>
                <input type="number" id="input-precio" placeholder="Ej: 4.00" step="0.01" min="0">
            </div>

            <div class="input-group">
                <label>Número de acciones</label>
                <input type="number" id="input-cantidad" placeholder="Ej: 50" step="1" min="1">
            </div>

            <button onclick="agregarAccion()">
                Guardar Acción
            </button>
        </div>

        <div class="lista-acciones">
            <h4 style="font-weight: 600;">
                Tus Acciones
            </h4>
            <div id="contenedor-lista"></div>
        </div>
    </div>

    <script>
        const MERCADO = {
            "SAN.MC": {
                nombre: "Banco Santander",
                actual: 4.15,
                variacionDiaPorcentaje: 0.5
            },
            "TEF.MC": {
                nombre: "Telefónica",
                actual: 4.20,
                variacionDiaPorcentaje: -0.2
            },
            "IBE.MC": {
                nombre: "Iberdrola",
                actual: 11.80,
                variacionDiaPorcentaje: 1.1
            },
            "ITX.MC": {
                nombre: "Inditex",
                actual: 44.50,
                variacionDiaPorcentaje: -0.8
            },
            "BBVA.MC": {
                nombre: "BBVA",
                actual: 9.30,
                variacionDiaPorcentaje: 0.0
            }
        };

        let usuarioActivo = sessionStorage.getItem("usuario_activo") || "";
        let misAcciones = [];
        let BASE_DATOS = cargarBaseDatos();

        inicializarApp();

        function cargarBaseDatos() {
            const datosPorDefecto = {
                usuarios: {
                    admin: "bolsa123"
                },
                carteras: {
                    admin: []
                }
            };

            try {
                const datosGuardados = localStorage.getItem("app_ibex_final_db");

                if (!datosGuardados) {
                    localStorage.setItem("app_ibex_final_db", JSON.stringify(datosPorDefecto));
                    return datosPorDefecto;
                }

                const datosParseados = JSON.parse(datosGuardados);

                if (!datosParseados.usuarios || !datosParseados.carteras) {
                    localStorage.setItem("app_ibex_final_db", JSON.stringify(datosPorDefecto));
                    return datosPorDefecto;
                }

                return datosParseados;
            } catch (error) {
                localStorage.setItem("app_ibex_final_db", JSON.stringify(datosPorDefecto));
                return datosPorDefecto;
            }
        }

        function guardarBaseDatos() {
            localStorage.setItem("app_ibex_final_db", JSON.stringify(BASE_DATOS));
        }

        function inicializarApp() {
            if (usuarioActivo && BASE_DATOS.usuarios[usuarioActivo]) {
                mostrarAppPrincipal();
            } else {
                mostrarLogin();
            }
        }

        function mostrarLogin() {
            document.getElementById("pantalla-login").style.display = "flex";
            document.getElementById("app-principal").style.display = "none";
            limpiarError();
        }

        function mostrarAppPrincipal() {
            document.getElementById("pantalla-login").style.display = "none";
            document.getElementById("app-principal").style.display = "block";

            document.getElementById("nombre-usuario-activo").textContent = usuarioActivo;

            if (!BASE_DATOS.carteras[usuarioActivo]) {
                BASE_DATOS.carteras[usuarioActivo] = [];
                guardarBaseDatos();
            }

            misAcciones = BASE_DATOS.carteras[usuarioActivo];
            pintarCartera();
        }

        function cambiarModoLogin(esRegistro) {
            limpiarError();

            const titulo = document.getElementById("login-titulo");
            const bloqueLogin = document.getElementById("bloque-botones-login");
            const bloqueRegistro = document.getElementById("bloque-botones-registro");

            if (esRegistro) {
                titulo.textContent = "Crear Cuenta";
                bloqueLogin.style.display = "none";
                bloqueRegistro.style.display = "block";
            } else {
                titulo.textContent = "Acceso Seguro";
                bloqueLogin.style.display = "block";
                bloqueRegistro.style.display = "none";
            }
        }

        function verificarAcceso() {
            const usuario = obtenerUsuarioInput();
            const password = obtenerPasswordInput();

            if (!usuario || !password) {
                mostrarError("Introduce usuario y contraseña.");
                return;
            }

            if (!BASE_DATOS.usuarios[usuario]) {
                mostrarError("El usuario no existe.");
                return;
            }

            if (BASE_DATOS.usuarios[usuario] !== password) {
                mostrarError("Contraseña incorrecta.");
                return;
            }

            usuarioActivo = usuario;
            sessionStorage.setItem("usuario_activo", usuarioActivo);
            mostrarAppPrincipal();
        }

        function registrarNuevoUsuario() {
            const usuario = obtenerUsuarioInput();
            const password = obtenerPasswordInput();

            if (!usuario || !password) {
                mostrarError("Introduce usuario y contraseña.");
                return;
            }

            if (usuario.length < 3) {
                mostrarError("El usuario debe tener al menos 3 caracteres.");
                return;
            }

            if (password.length < 4) {
                mostrarError("La contraseña debe tener al menos 4 caracteres.");
                return;
            }

            if (BASE_DATOS.usuarios[usuario]) {
                mostrarError("Ese usuario ya existe.");
                return;
            }

            BASE_DATOS.usuarios[usuario] = password;
            BASE_DATOS.carteras[usuario] = [];
            guardarBaseDatos();

            usuarioActivo = usuario;
            sessionStorage.setItem("usuario_activo", usuarioActivo);

            mostrarAppPrincipal();
        }

        function cerrarSesion() {
            usuarioActivo = "";
            misAcciones = [];
            sessionStorage.removeItem("usuario_activo");

            document.getElementById("login-usuario").value = "";
            document.getElementById("login-password").value = "";

            cambiarModoLogin(false);
            mostrarLogin();
        }

        function agregarAccion() {
            const ticker = document.getElementById("select-empresa").value;
            const precioCompra = parseFloat(document.getElementById("input-precio").value);
            const cantidad = parseInt(document.getElementById("input-cantidad").value, 10);

            if (!ticker || !MERCADO[ticker]) {
                alert("Selecciona una empresa válida.");
                return;
            }

            if (isNaN(precioCompra) || precioCompra <= 0) {
                alert("Introduce un precio de compra válido.");
                return;
            }

            if (isNaN(cantidad) || cantidad <= 0) {
                alert("Introduce un número de acciones válido.");
                return;
            }

            const nuevaAccion = {
                id: Date.now(),
                ticker: ticker,
                nombre: MERCADO[ticker].nombre,
                precioCompra: precioCompra,
                cantidad: cantidad
            };

            misAcciones.push(nuevaAccion);
            BASE_DATOS.carteras[usuarioActivo] = misAcciones;
            guardarBaseDatos();

            document.getElementById("input-precio").value = "";
            document.getElementById("input-cantidad").value = "";

            pintarCartera();
        }

        function borrarAccion(id) {
            misAcciones = misAcciones.filter(function(accion) {
                return accion.id !== id;
            });

            BASE_DATOS.carteras[usuarioActivo] = misAcciones;
            guardarBaseDatos();

            pintarCartera();
        }

        function pintarCartera() {
            const contenedor = document.getElementById("contenedor-lista");

            contenedor.innerHTML = "";

            let valorActualTotal = 0;
            let valorCompraTotal = 0;
            let revalDiaTotal = 0;

            if (!misAcciones || misAcciones.length === 0) {
                contenedor.innerHTML = '<div class="mensaje-vacio">Todavía no has añadido acciones.</div>';
            }

            misAcciones.forEach(function(accion) {
                const datosMercado = MERCADO[accion.ticker];

                if (!datosMercado) {
                    return;
                }

                const precioActual = datosMercado.actual;
                const variacionDiaPorcentaje = datosMercado.variacionDiaPorcentaje;

                const valorActual = precioActual * accion.cantidad;
                const valorCompra = accion.precioCompra * accion.cantidad;
                const beneficioTotal = valorActual - valorCompra;
                const beneficioTotalPorcentaje = valorCompra > 0 ? beneficioTotal / valorCompra * 100 : 0;

                const precioAyerEstimado = precioActual / (1 + variacionDiaPorcentaje / 100);
                const revalDia = (precioActual - precioAyerEstimado) * accion.cantidad;

                valorActualTotal += valorActual;
                valorCompraTotal += valorCompra;
                revalDiaTotal += revalDia;

                const claseBeneficio = obtenerClaseColor(beneficioTotal);

                const item = document.createElement("div");
                item.className = "accion-item";

                item.innerHTML = `
                    <div class="accion-fila">
                        <div>
                            <div class="accion-nombre">${accion.nombre}</div>
                            <div class="accion-detalles">
                                ${accion.ticker}<br>
                                ${accion.cantidad} acciones<br>
                                Compra: ${formatearEuros(accion.precioCompra)} por acción<br>
                                Actual: ${formatearEuros(precioActual)} por acción
                            </div>
                        </div>

                        <div class="accion-precio">
                            <div>${formatearEuros(valorActual)}</div>
                            <div class="${claseBeneficio}" style="font-size: 12px;">
                                ${formatearEurosConSigno(beneficioTotal)}
                                (${formatearPorcentajeConSigno(beneficioTotalPorcentaje)})
                            </div>
                            <button class="btn-borrar" onclick="borrarAccion(${accion.id})">
                                Borrar
                            </button>
                        </div>
                    </div>
                `;

                contenedor.appendChild(item);
            });

            const revalTotal = valorActualTotal - valorCompraTotal;
            const revalTotalPorcentaje = valorCompraTotal > 0 ? revalTotal / valorCompraTotal * 100 : 0;
            const revalDiaPorcentaje = valorActualTotal > 0 ? revalDiaTotal / valorActualTotal * 100 : 0;

            actualizarResumen(valorActualTotal, revalDiaTotal, revalDiaPorcentaje, revalTotal, revalTotalPorcentaje);
        }

        function actualizarResumen(valorActualTotal, revalDiaTotal, revalDiaPorcentaje, revalTotal, revalTotalPorcentaje) {
            const totalCartera = document.getElementById("total-cartera");
            const revalDia = document.getElementById("reval-dia");
            const revalTotalElemento = document.getElementById("reval-total");

            totalCartera.textContent = formatearEuros(valorActualTotal);

            revalDia.textContent = `${formatearEurosConSigno(revalDiaTotal)} (${formatearPorcentajeConSigno(revalDiaPorcentaje)})`;
            revalDia.className = obtenerClaseColor(revalDiaTotal);

            revalTotalElemento.textContent = `${formatearEurosConSigno(revalTotal)} (${formatearPorcentajeConSigno(revalTotalPorcentaje)})`;
            revalTotalElemento.className = obtenerClaseColor(revalTotal);
        }

        function obtenerClaseColor(valor) {
            if (valor > 0) {
                return "positivo";
            }

            if (valor < 0) {
                return "negativo";
            }

            return "neutro";
        }

        function formatearEuros(valor) {
            return valor.toLocaleString("es-ES", {
                style: "currency",
                currency: "EUR"
            });
        }

        function formatearEurosConSigno(valor) {
            const signo = valor > 0 ? "+" : "";
            return signo + formatearEuros(valor);
        }

        function formatearPorcentajeConSigno(valor) {
            const signo = valor > 0 ? "+" : "";

            return signo + valor.toLocaleString("es-ES", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + "%";
        }

        function obtenerUsuarioInput() {
            return document.getElementById("login-usuario").value.trim();
        }

        function obtenerPasswordInput() {
            return document.getElementById("login-password").value.trim();
        }

        function mostrarError(mensaje) {
            const error = document.getElementById("error-login");
            error.textContent = mensaje;
            error.style.display = "block";
        }

        function limpiarError() {
            const error = document.getElementById("error-login");
            error.textContent = "";
            error.style.display = "none";
        }
    </script>

</body>
</html>
