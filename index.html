<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cartera Sincronizada IBEX 35</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .balance-total { font-size: 32px; font-weight: bold; margin: 5px 0; }
        .reval-container {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            border-top: 1px solid #334155;
            padding-top: 10px;
            font-size: 14px;
        }
        .reval-box { text-align: center; }
        .positivo { color: #10b981; font-weight: bold; }
        .negativo { color: #ef4444; font-weight: bold; }
        .neutro { color: #94a3b8; font-weight: bold; }
        .formulario { background-color: #334155; padding: 15px; border-radius: 12px; margin-bottom: 25px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background-color: #059669; }
        .lista-acciones { margin-top: 20px; }
        .accion-item { background-color: #334155; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .accion-fila { display: flex; justify-content: space-between; align-items: center; }
        .accion-nombre { font-weight: bold; }
        .accion-detalles { font-size: 12px; color: #94a3b8; }
        .accion-precio { text-align: right; font-weight: bold; }
        .btn-borrar {
            background-color: #ef4444;
            padding: 4px 8px;
            font-size: 11px;
            width: auto;
            margin-top: 8px;
            border-radius: 4px;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CONTROL DE ACCESO (LOGIN Y REGISTRO) -->
    <div id="pantalla-login" style="display: flex; justify-content: center; align-items: center; width: 100%;">
        <div style="background-color: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 320px; text-align: center; box-sizing: border-box;">
            <h2 id="login-titulo" style="color: #f8fafc; margin-bottom: 20px; font-weight: 600;">Acceso Seguro</h2>
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px;">Usuario</label>
                <input type="text" id="login-usuario" placeholder="Introduce tu usuario" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px;">Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; box-sizing: border-box;">
            </div>
            
            <div id="bloque-botones-login">
                <button onclick="verificarAcceso()" style="width: 100%; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 15px;">Iniciar Sesión</button>
                <span style="color: #94a3b8; font-size: 13px;">¿No tienes cuenta? <a href="#" onclick="cambiarModoLogin(true)" style="color: #3b82f6; text-decoration: none; font-weight: bold;">Regístrate</a></span>
            </div>
            
            <div id="bloque-botones-registro" style="display: none;">
                <button onclick="registrarNuevoUsuario()" style="width: 100%; background-color: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 15px;">Crear Cuenta Remota</button>
                <span style="color: #94a3b8; font-size: 13px;">¿Ya tienes cuenta? <a href="#" onclick="cambiarModoLogin(false)" style="color: #3b82f6; text-decoration: none; font-weight: bold;">Identifícate</a></span>
            </div>
            
            <p id="error-login" style="color: #ef4444; font-size: 12px; margin-top: 15px; display: none; font-weight: 500;"></p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE LA APP -->
    <div id="app-principal" class="app-container" style="display: none;">
        <div class="header">
            <h2 style="margin-bottom: 5px; font-weight: 600;">Mi Cartera Remota IBEX 35</h2>
            <div style="font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 15px;">
                Usuario: <span id="nombre-usuario-activo"></span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button onclick="cerrarSesion()" style="width: auto; background-color: #475569; font-size: 11px; padding: 6px 12px; border: none; color: white; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
                <span id="estado-api" style="font-size: 11px; color: #10b981; font-weight: bold;">Sincronizado Remoto</span>
            </div>
        </div>

        <div class="balance-card">
            <div style="color: #94a3b8; font-size: 14px;">Valor de tu Cartera</div>
            <div class="balance-total" id="total-cartera">0,00 €</div>
            
            <div class="reval-container">
                <div class="reval-box">
                    <div style="font-size: 11px; color: #94a3b8;">REVAL. HOY</div>
                    <div id="reval-dia" class="neutro">0,00 € (0%)</div>
                </div>
                <div class="reval-box">
                    <div style="font-size: 11px; color: #94a3b8;">REVAL. ACUMULADA</div>
                    <div id="reval-total" class="neutro">0,00 € (0%)</div>
                </div>
            </div>
        </div>

        <div class="formulario">
            <h4 style="margin-top: 0; margin-bottom: 15px; font-weight: 600;">Añadir Acción</h4>
            <div class="input-group">
                <label>Empresa del Ibex</label>
                <select id="select-empresa">
                    <option value="SAN.MC">Banco Santander</option>
                    <option value="TEF.MC">Telefónica</option>
                    <option value="IBE.MC">Iberdrola</option>
                    <option value="ITX.MC">Inditex</option>
                    <option value="BBVA.MC">BBVA</option>
                </select>
            </div>
            <div class="input-group">
                <label>Cantidad de Acciones</label>
                <input type="number" id="input-cantidad" min="1" placeholder="Ej: 50">
            </div>
            <div class="input-group">
                <label>Precio de Compra por Acción (€)</label>
                <input type="number" id="input-precio-compra" step="0.01" min="0" placeholder="Ej: 4.25">
            </div>
            <button onclick="añadirAccion()">Añadir a la Cartera</button>
        </div>

        <div class="lista-acciones" id="contenedor-acciones">
            <!-- Las acciones añadidas aparecerán aquí dinámicamente -->
        </div>
    </div>

    <!-- LÓGICA DE PROGRAMACIÓN JAVASCRIPT -->
    <script>
        // Base de datos de cotizaciones simulada (Precios reales de mercado simulados + variación de hoy)
const mercadoIbex = {
    "SAN.MC": { nombre: "Banco Santander", precioActual: 4.50, cambioPorcentaje: 1.2 },
    "TEF.MC": { nombre: "Telefónica", precioActual: 3.95, cambioPorcentaje: -0.5 },
    "IBE.MC": { nombre: "Iberdrola", precioActual: 11.80, cambioPorcentaje: 0.8 },
    "ITX.MC": { nombre: "Inditex", precioActual: 45.20, cambioPorcentaje: 2.1 },
    "BBVA.MC": { nombre: "BBVA", precioActual: 9.15, cambioPorcentaje: -1.4 }
};

let usuarioActual = null;
let carteraUsuario = [];

// CORREGIDO: Cambiar entre interfaz de Login y Registro sin romper el formulario
function cambiarModoLogin(esRegistro) {
    const titulo = document.getElementById('login-titulo');
    const btnLogin = document.getElementById('bloque-botones-login');
    const btnRegistro = document.getElementById('bloque-botones-registro');
    const error = document.getElementById('error-login');
    
    // Limpiamos errores anteriores y campos al cambiar de modo
    error.style.display = 'none';
    document.getElementById('login-usuario').value = '';
    document.getElementById('login-password').value = '';
    
    if (esRegistro) {
        titulo.innerText = "Registro Remoto";
        btnLogin.style.display = 'none';
        btnRegistro.style.display = 'block';
    } else {
        titulo.innerText = "Acceso Seguro";
        btnLogin.style.display = 'block';
        btnRegistro.style.display = 'none';
    }
}

// CORREGIDO: Registrar un nuevo usuario en LocalStorage de forma efectiva
function registrarNuevoUsuario() {
    const user = document.getElementById('login-usuario').value.trim();
    const pass = document.getElementById('login-password').value.trim();
    const error = document.getElementById('error-login');

    if (user === "" || pass === "") {
        mostrarError("Por favor, rellena todos los campos.");
        return;
    }

    let usuarios = JSON.parse(localStorage.getItem('usuarios_app')) || {};

    if (usuarios[user]) {
        mostrarError("El usuario ya existe.");
        return;
    }

    // Guardamos el usuario con su cartera vacía inicial
    usuarios[user] = { password: pass, cartera: [] };
    localStorage.setItem('usuarios_app', JSON.stringify(usuarios));
    
    alert("¡Cuenta creada con éxito! Ya puedes iniciar sesión.");
    cambiarModoLogin(false); // Te devuelve automáticamente a la pantalla de login
}

// Verificar credenciales de acceso
function verificarAcceso() {
    const user = document.getElementById('login-usuario').value.trim();
    const pass = document.getElementById('login-password').value.trim();
    
    let usuarios = JSON.parse(localStorage.getItem('usuarios_app')) || {};

    if (usuarios[user] && usuarios[user].password === pass) {
        usuarioActual = user;
        carteraUsuario = usuarios[user].cartera || [];
        
        document.getElementById('pantalla-login').style.display = 'none';
        document.getElementById('app-principal').style.display = 'block';
        document.getElementById('nombre-usuario-activo').innerText = user;
        
        actualizarInterfazCartera();
    } else {
        mostrarError("Usuario o contraseña incorrectos.");
    }
}

function cerrarSesion() {
    usuarioActual = null;
    carteraUsuario = [];
    document.getElementById('login-usuario').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('pantalla-login').style.display = 'flex';
    document.getElementById('app-principal').style.display = 'none';
}

function mostrarError(mensaje) {
    const error = document.getElementById('error-login');
    error.innerText = mensaje;
    error.style.display = 'block';
}

// Guardar cambios de la cartera en el "servidor" local
function guardarCarteraEnStorage() {
    let usuarios = JSON.parse(localStorage.getItem('usuarios_app')) || {};
    if (usuarios[usuarioActual]) {
        usuarios[usuarioActual].cartera = carteraUsuario;
        localStorage.setItem('usuarios_app', JSON.stringify(usuarios));
    }
}

// Añadir activo financiero a la lista
function añadirAccion() {
    const ticker = document.getElementById('select-empresa').value;
    const cantidad = parseInt(document.getElementById('input-cantidad').value);
    const precioCompra = parseFloat(document.getElementById('input-precio-compra').value);

    if (!cantidad || cantidad <= 0 || !precioCompra || precioCompra <= 0) {
        alert("Introduce valores numéricos válidos y mayores que cero.");
        return;
    }

    const nuevaAccion = {
        id: Date.now(),
        ticker: ticker,
        cantidad: cantidad,
        precioCompra: precioCompra
    };

    carteraUsuario.push(nuevaAccion);
    guardarCarteraEnStorage();
    actualizarInterfazCartera();

    document.getElementById('input-cantidad').value = '';
    document.getElementById('input-precio-compra').value = '';
}

// Eliminar activo financiero
function eliminarAccion(id) {
    carteraUsuario = carteraUsuario.filter(item => item.id !== id);
    guardarCarteraEnStorage();
    actualizarInterfazCartera();
}

// Realizar cálculos matemáticos y pintar la interfaz
function actualizarInterfazCartera() {
    const contenedor = document.getElementById('contenedor-acciones');
    contenedor.innerHTML = '';

    let totalValorActual = 0;
    let totalCosteCompra = 0;
    let totalRevalDiaEuros = 0;

    carteraUsuario.forEach(accion => {
        const infoMercado = mercadoIbex[accion.ticker];
        const costeCompraItem = accion.cantidad * accion.precioCompra;
        const valorActualItem = accion.cantidad * infoMercado.precioActual;
        
        totalCosteCompra += costeCompraItem;
        totalValorActual += valorActualItem;
        
        const precioAyer = infoMercado.precioActual / (1 + (infoMercado.cambioPorcentaje / 100));
        const revalDiaItem = (infoMercado.precioActual - precioAyer) * accion.cantidad;
        totalRevalDiaEuros += revalDiaItem;

        const revalAcumuladaItem = valorActualItem - costeCompraItem;
        const revalAcumuladaPorcItem = costeCompraItem > 0 ? (revalAcumuladaItem / costeCompraItem) * 100 : 0;
        const claseColorItem = revalAcumuladaItem >= 0 ? 'positivo' : 'negativo';

        contenedor.innerHTML += `
            <div class="accion-item">
                <div class="accion-fila">
                    <div>
                        <span class="accion-nombre">${infoMercado.nombre}</span>
                        <div class="accion-detalles">${accion.cantidad} tít. a ${accion.precioCompra.toFixed(2)}€</div>
                    </div>
                    <div class="accion-precio">
                        <div>${valorActualItem.toFixed(2)} €</div>
                        <div class="${claseColorItem}" style="font-size: 12px;">
                            ${revalAcumuladaItem >= 0 ? '+' : ''}${revalAcumuladaItem.toFixed(2)}€ (${revalAcumuladaPorcItem.toFixed(1)}%)
                        </div>
                    </div>
                </div>
                <button class="btn-borrar" onclick="eliminarAccion(${accion.id})">Eliminar</button>
            </div>
        `;
    });

    document.getElementById('total-cartera').innerText = `${totalValorActual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;

    const revalDiaPorcentaje = (totalValorActual - totalRevalDiaEuros) > 0 ? (totalRevalDiaEuros / (totalValorActual - totalRevalDiaEuros)) * 100 : 0;
    const elRevalDia = document.getElementById('reval-dia');
    elRevalDia.innerText = `${totalRevalDiaEuros >= 0 ? '+' : ''}${totalRevalDiaEuros.toFixed(2)} € (${revalDiaPorcentaje.toFixed(2)}%)`;
    elRevalDia.className = totalRevalDiaEuros > 0 ? 'positivo' : (totalRevalDiaEuros < 0 ? 'negativo' : 'neutro');

    const totalRevalAcumuladaEuros = totalValorActual - totalCosteCompra;
    const totalRevalAcumuladaPorc = totalCosteCompra > 0 ? (totalRevalAcumuladaEuros / totalCosteCompra) * 100 : 0;
    const elRevalTotal = document.getElementById('reval-total');
    elRevalTotal.innerText = `${totalRevalAcumuladaEuros >= 0 ? '+' : ''}${totalRevalAcumuladaEuros.toFixed(2)} € (${totalRevalAcumuladaPorc.toFixed(2)}%)`;
    elRevalTotal.className = totalRevalAcumuladaEuros > 0 ? 'positivo' : (totalRevalAcumuladaEuros < 0 ? 'negativo' : 'neutro');
